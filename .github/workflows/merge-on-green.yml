name: Merge on green

# Squash-merges a pull request as soon as CI passes on it. Releases stay a deliberate
# step: they are cut by pushing a version tag, which release.yml builds.
#
# When another pull request merged first, this one is out of date with main and
# branch protection refuses it. It is then brought up to date and CI runs on the
# result; when that passes, this workflow runs again and merges it. A branch update
# made with this workflow's token starts no workflow, so that CI run is started
# explicitly (workflow_dispatch is the exception).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  merge:
    name: Merge
    # A successful CI run on a pull request from this repository (Dependabot's
    # included), or the run started here after bringing one up to date. Pull requests
    # from forks are left for a person.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.event == 'pull_request' ||
       github.event.workflow_run.event == 'workflow_dispatch') &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Merge the pull request, or bring it up to date
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE: ${{ github.event.repository.default_branch }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          pr=$(gh pr list -R "$REPO" --head "$BRANCH" --state open \
            --json number,isDraft,baseRefName,headRefOid \
            --jq '.[] | select(.headRefOid == env.HEAD_SHA and (.isDraft | not) and .baseRefName == env.BASE) | .number' | head -1)
          if [ -z "$pr" ]; then
            echo "No open, ready pull request into $BASE at $HEAD_SHA."
            exit 0
          fi
          # Only the commit CI just passed, never one pushed since.
          if gh pr merge "$pr" -R "$REPO" --squash --delete-branch --match-head-commit "$HEAD_SHA"; then
            exit 0
          fi

          # Refused. If only because main moved on, bring the branch up to date and run
          # CI on the result; any other reason is for a person.
          state=UNKNOWN
          for _ in $(seq 1 6); do
            state=$(gh pr view "$pr" -R "$REPO" --json mergeStateStatus --jq .mergeStateStatus)
            [ "$state" != UNKNOWN ] && break
            sleep 5
          done
          if [ "$state" != BEHIND ]; then
            echo "#$pr was not merged, and not because it is behind $BASE (merge state: $state)." >&2
            exit 1
          fi
          gh pr update-branch "$pr" -R "$REPO"
          # The update can land a moment later, and CI has to run on the updated head.
          head="$HEAD_SHA"
          for _ in $(seq 1 30); do
            head=$(gh pr view "$pr" -R "$REPO" --json headRefOid --jq .headRefOid)
            [ "$head" != "$HEAD_SHA" ] && break
            sleep 2
          done
          if [ "$head" = "$HEAD_SHA" ]; then
            echo "#$pr was not brought up to date within a minute." >&2
            exit 1
          fi
          gh workflow run ci.yml -R "$REPO" --ref "$BRANCH"
          echo "#$pr was behind $BASE: brought it up to date and started CI on it."
